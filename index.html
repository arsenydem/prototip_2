<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПрофКейс — отбор новичков по реальным рабочим задачам</title>
<style>
:root{
  --p:#4f46e5; --p2:#7c3aed; --pl:#eef2ff;
  --g:#059669; --gl:#ecfdf5;
  --a:#d97706; --al:#fffbeb;
  --r:#dc2626; --rl:#fef2f2;
  --ink:#111827; --mut:#6b7280; --line:#e5e7eb;
  --bg:#f6f7fb; --card:#ffffff;
  --sh:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
a{color:var(--p);text-decoration:none}
.container{max-width:1120px;margin:0 auto;padding:0 24px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:28px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap}
.logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
nav.main{display:flex;gap:4px;flex:1}
nav.main a{padding:8px 14px;border-radius:9px;color:#374151;font-weight:600;font-size:14px}
nav.main a:hover{background:var(--pl);color:var(--p)}
nav.main a.on{background:var(--pl);color:var(--p)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;transition:.15s}
.btn-p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.btn-p:hover{filter:brightness(1.08)}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-o:hover{border-color:var(--p);color:var(--p)}
.btn-g{background:var(--g);color:#fff}
.btn-r{background:var(--r);color:#fff}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-lg{padding:14px 26px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.55;cursor:default}

/* generic */
main{padding:32px 0 64px;min-height:calc(100vh - 130px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.pad{padding:24px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.b-pl{background:var(--pl);color:var(--p)}
.b-gl{background:var(--gl);color:var(--g)}
.b-al{background:var(--al);color:var(--a)}
.b-rl{background:var(--rl);color:var(--r)}
.b-gr{background:#f3f4f6;color:#374151}
h1{font-size:34px;line-height:1.2;letter-spacing:-.5px}
h2{font-size:24px;letter-spacing:-.3px}
h3{font-size:17px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:600;margin-bottom:14px}
.back:hover{color:var(--p)}

/* score helpers */
.avg{font-weight:800;font-size:22px}
.sc-hi{color:var(--g)}.sc-mid{color:var(--a)}.sc-lo{color:var(--r)}
.crit{margin-top:12px}
.crit-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.crit-head .w{color:var(--mut);font-weight:500}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .6s}

/* hero */
.hero{padding:64px 0 40px;text-align:center}
.hero h1{font-size:44px;max-width:840px;margin:0 auto}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{max-width:640px;margin:18px auto 0;font-size:17px;color:#374151}
.cta{display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap}

/* stats band */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:48px 0}
.stat{padding:20px;text-align:center}
.stat .n{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat p{font-size:13px;color:var(--mut);margin-top:4px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{padding:22px}
.step .num{width:34px;height:34px;border-radius:10px;background:var(--pl);color:var(--p);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.step h3{margin:12px 0 6px}
.step p{font-size:13.5px;color:var(--mut)}

/* quotes */
.quote{padding:20px;border-left:4px solid var(--p)}
.quote p{font-size:14.5px;font-style:italic}
.quote .who{margin-top:10px;font-size:12.5px;color:var(--mut);font-style:normal}

/* vacancy cards */
.vac{padding:22px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.vac:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(79,70,229,.13)}
.vac h3{font-size:17px}
.sph{font-size:12px;font-weight:700}
.s-law{color:#7c3aed;background:#f5f3ff}
.s-mkt{color:#d97706;background:#fffbeb}
.s-it{color:#059669;background:#ecfdf5}

/* employer dash */
.kpi{padding:18px}
.kpi .n{font-size:26px;font-weight:800}
.kpi p{font-size:12.5px;color:var(--mut)}
.cand{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.cand:last-child{border-bottom:none}
.cand:hover{background:#fafbff}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.mini-crit{display:flex;gap:4px;margin-top:4px}
.mini-crit i{display:block;width:34px;height:6px;border-radius:99px;background:#eef0f4}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:20px}
.tabs button{border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--mut);padding:10px 16px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--p);border-color:var(--p)}

/* wizard */
.wiz-steps{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.wstep{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mut);padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.wstep.on{background:var(--pl);border-color:var(--pl);color:var(--p)}
.wstep.done{background:var(--gl);border-color:var(--gl);color:var(--g)}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input[type=text],.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
.field textarea{resize:vertical;line-height:1.6}
.field input[type=text]:hover,.field select:hover,.field textarea:hover{border-color:#c7cbd4}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(79,70,229,.11);background:#fdfdff}
input,select,textarea{accent-color:var(--p)}
::selection{background:rgba(79,70,229,.16)}
textarea::-webkit-scrollbar{width:10px}
textarea::-webkit-scrollbar-track{background:transparent}
textarea::-webkit-scrollbar-thumb{background:#d8dbe2;border-radius:99px;border:3px solid #fff}
textarea::-webkit-scrollbar-thumb:hover{background:#b9bec9}
textarea::placeholder,input::placeholder{color:#9aa1ad}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
mark{padding:1px 3px;border-radius:4px;font-weight:600}
mark.conf{background:#fee2e2;color:#b91c1c;text-decoration:line-through}
mark.anon{background:#d1fae5;color:#047857}
.del{background:#fee2e2;color:#b91c1c;text-decoration:line-through;padding:1px 3px;border-radius:4px;font-weight:600}
.diffbox{padding:18px;font-size:13.5px;line-height:1.7;background:#fff}
.diffbox h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;margin:0 8px 8px 0}
.chip .w{color:var(--mut);font-weight:500}

/* processing */
.proc{max-width:560px;margin:60px auto;text-align:center}
.proc .spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--pl);border-top-color:var(--p);margin:0 auto 24px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc ul{text-align:left;max-width:380px;margin:24px auto 0;list-style:none}
.proc li{padding:9px 0 9px 28px;position:relative;color:var(--mut);font-size:14px}
.proc li.done{color:var(--g)}
.proc li.done:before{content:'✓';position:absolute;left:0;font-weight:800}
.proc li.act{color:var(--ink);font-weight:600}
.proc li.act:before{content:'●';position:absolute;left:2px;color:var(--p);font-size:10px;top:12px}

/* task layout */
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.editor-wrap{border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.editor-wrap:focus-within{border-color:var(--p);box-shadow:0 0 0 4px rgba(79,70,229,.11)}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#f9fafb;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:#374151}
.editor-head .cnt{font-weight:600;color:var(--mut);font-size:12px}
.editor-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;background:#f9fafb;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.editor-wrap.dragover{border-color:var(--p);border-style:dashed;background:var(--pl)}
.linkbtn{border:none;background:none;font-family:inherit;font-size:12px;color:var(--p);font-weight:700;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
.linkbtn:hover{text-decoration:underline}
.filechip{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border:1.5px dashed #c7d2fe;background:var(--pl);border-radius:12px;font-size:13px;font-weight:700;color:var(--p);max-width:100%}
.filechip .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip .sz{color:var(--mut);font-weight:500;font-size:12px;flex-shrink:0}
.filechip .rm{margin-left:auto;border:none;background:#fff;color:var(--mut);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;flex-shrink:0;transition:.12s}
.filechip .rm:hover{background:var(--rl);color:var(--r)}
.dropzone{border:2px dashed #c7d2fe;border-radius:14px;background:#fafbff;padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--p);background:var(--pl)}
.dropzone.dragover{border-color:var(--p);border-style:solid;background:var(--pl)}
.dropzone .ic{font-size:32px}
.dropzone .big{font-size:15px;font-weight:700;margin-top:8px}
.dropzone .fmts{font-size:12.5px;color:var(--mut);margin-top:4px}
.filebar{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbff}
.filebar .fico{width:40px;height:40px;border-radius:10px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.filebar .fmeta{flex:1;min-width:0}
.filebar b{font-size:13.5px;word-break:break-all}
.solution-editor{display:block;width:100%;min-height:320px;padding:16px 18px;border:none;outline:none;font-family:inherit;font-size:14px;line-height:1.7;resize:vertical;background:#fff;color:var(--ink)}
.num-in{width:56px;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font-family:inherit;font-size:13px;text-align:center;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.num-in:hover{border-color:#c7cbd4}
.num-in:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.11)}
.sol-text{font-size:14px;line-height:1.75;white-space:pre-wrap;background:#fafbff;padding:18px;border-radius:12px;border:1px solid var(--line)}
pre.code{background:#0f172a;color:#e2e8f0;padding:18px;border-radius:12px;font-size:12.5px;line-height:1.6;overflow-x:auto;font-family:Consolas,'Courier New',monospace}

/* misc */
.pill-list{display:flex;gap:8px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--al);color:var(--a);font-weight:700;font-size:13px;padding:7px 14px;border-radius:99px}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:6px 0}
.tick:before{content:'✓';color:var(--g);font-weight:800}
.tick.imp:before{content:'→';color:var(--a)}
footer{border-top:1px solid var(--line);padding:22px 0;font-size:12.5px;color:var(--mut);background:#fff}

/* modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.55)}
.modal{position:relative;max-width:680px;margin:5vh auto;background:#fff;border-radius:18px;max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.modal .x{position:absolute;top:14px;right:14px;border:none;background:#f3f4f6;width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;font-weight:700;color:#374151}
.modal .x:hover{background:#e5e7eb}

/* toast */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{background:#111827;color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .25s}
.toast.ok{background:var(--g)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.follow{border:1.5px solid #fde68a;background:var(--al);border-radius:14px;padding:18px}
.flag{display:inline-flex;align-items:center;gap:7px;background:var(--rl);color:var(--r);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px}
.divider{height:1px;background:var(--line);margin:18px 0}
@media(max-width:900px){.grid2,.grid3,.grid4,.steps,.stats{grid-template-columns:1fr 1fr}.task-grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
@media(max-width:560px){.grid3,.grid4{grid-template-columns:1fr}nav.main{display:none}}
</style>
</head>
<body>

<header>
  <div class="container hd">
    <a href="#/" class="logo"><span class="mark">ПК</span>ПрофКейс</a>
    <nav class="main" id="nav"></nav>
  </div>
</header>

<main><div class="container" id="app"></div></main>

<footer style="display:none"></footer>
<div id="modal-root"><div class="overlay" onclick="App.closeModal()"></div><div class="modal" id="modal-body"></div></div>
<div id="toast-root"></div>

<script>
const APP_NAME = 'ПрофКейс';

/* ================= ДАННЫЕ ================= */

const DB = {
  vacancies: [
    {
      id:'law', icon:'⚖️', sphere:'Юриспруденция', sc:'s-law',
      title:'Помощник юриста (договорная работа)',
      company:'Юридическая фирма «Правовой стандарт»', city:'Санкт-Петербург',
      level:'Можно без опыта', salary:'от 45 000 ₽', work:'Гибрид, 2/3 дня в офисе',
      short:'Помощь юристам в проверке договоров, претензионной работе и подготовке заключений для клиентов.',
      taskTime:'2,5 часа',
      taskIntro:'Клиент фирмы просит проверить договор подряда перед подписанием. Этим займётся юрист, но ему нужно ваше заключение как первый фильтр: какие пункты опасны для заказчика и что поправить.',
      taskSteps:[
        'Найдите 3–4 пункта договора, создающих риски для заказчика (сроки, ответственность, приёмка).',
        'Для каждого пункта укажите применимую норму ГК РФ одним предложением.',
        'Предложите конкретную правку формулировки (что заменить и на что).',
        'Напишите краткое заключение на 5–7 предложений для руководителя клиента.'
      ],
      materials:['Договор подряда № 147 между ООО «Альфа» и АО «Бета» (PDF)','Шаблон заключения фирмы'],
      criteria:[
        {n:'Выявление ключевых рисков договора',w:30},
        {n:'Знание применимых норм (ГК РФ)',w:25},
        {n:'Качество предлагаемых правок',w:25},
        {n:'Ясность и структура заключения',w:20}
      ],
      followUp:'В 2–3 предложениях объясните: какую норму вы считаете ключевой для защиты заказчика в этом договоре и почему именно она?',
      feedback:{avg:'4,6',scores:[4.8,4.6,4.6,4.4],
        strengths:['Нашла риск в п. 7.3 (односторонний отказ подрядчика), который пропустили почти все','Правки сформулированы как готовый текст для договора, а не как абстрактные советы','Заключение структурировано: сначала вывод, потом обоснование'],
        improve:['Добавить ссылки на судебную практику по ст. 708 ГК РФ','Сократить вступительную часть заключения']},
      candidates:[
        {name:'Анна Смирнова', meta:'СПбГУ, юрфак, 4 курс', date:'2 ноя', avg:4.6, status:'rec',
         scores:[4.8,4.6,4.6,4.4],
         file:{name:'Smirnova_договор_147_заключение.pdf',size:248320,type:'pdf'},
         solution:'1. П. 4.2 — срок сдачи работ установлен, но неустойка за просрочку подрядчика не определена → ст. 708 ГК РФ. Правка: дополнить пункт неустойкой 0,1% от цены работ за каждый день просрочки.\n2. П. 5.1 — ответственность подрядчика ограничена 1% цены работ → ст. 400 ГК РФ. Правка: поднять предел до 10% и исключить ущерб от него.\n3. П. 6.3 — приёмка без акта при молчании заказчика 3 дня → ст. 720 ГК РФ. Правка: срок 10 рабочих дней + письменное уведомление.\n4. П. 7.3 — подрядчик вправе отказаться от договора в одностороннем порядке без компенсации → ст. 310 ГК РФ. Правка: только по соглашению сторон либо с компенсацией фактически понесённых расходов заказчика.\n\nЗаключение: договор подписывать преждевременно. Ключевой риск — п. 7.3...',
         comment:'Единственная из кандидатов заметила п. 7.3 об одностороннем отказе — реально встречается в практике фирмы. Заключение можно почти без правок отправить клиенту.',
         follow:{a:'Ключевая — ст. 310 ГК РФ в связке с п. 7.3: подрядчик прописал себе право выйти из договора в любой момент, а заказчик такой возможности не получил. Это перекладывает все расходы на заказчика, поэтому именно этот пункт я бы правила первым.', badge:'ok', btxt:'Самостоятельно, развёрнуто'}},
        {name:'Дмитрий Ковалёв', meta:'ВШЭ СПб, юрфак, выпускник', date:'1 ноя', avg:3.7, status:'wait',

const $=s=>document.querySelector(s);

const scoreCls=v=>v>=4?'sc-hi':(v>=3?'sc-mid':'sc-lo');
const barColor=v=>v>=4?'var(--g)':(v>=3?'var(--a)':'var(--r)');
const statusBadge=s=>s==='rec'?'<span class="badge b-gl">Рекомендован</span>':s==='wait'?'<span class="badge b-al">На рассмотрении</span>':'<span class="badge b-rl">Проверить самостоятельность</span>';

const initials=n=>n.split(' ').map(x=>x[0]).join('');
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const escT=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA=t=>t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function critBlock(scores, criteria){
  return criteria.map((c,i)=>{
    const v=scores[i]||0;
    return `<div class="crit"><div class="crit-head"><span>${c.n} <span class="w">· вес ${c.w}%</span></span><span class="${scoreCls(v)}"><b>${String(v).replace('.',',')}</b> / 5</span></div><div class="bar"><div class="fill" style="width:${v/5*100}%;background:${barColor(v)}"></div></div></div>`;
  }).join('');
}
function toast(msg, ok){
  const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=msg;
  $('#toast-root').appendChild(t);setTimeout(()=>t.remove(),3200);
}

      <div class="field mt16"><label>Комментарий к решению <span class="mut" style="font-weight:500">· необязательно</span></label>
        <textarea rows="4" id="sol" placeholder="На что обратить внимание при проверке, какие решения вы приняли и почему…">${escT(draft)}</textarea></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn btn-p" onclick="App.submit('${id}')">Отправить решение →</button>
      </div>
    </div>
  </div>`;
}

function vProcessing(id){
  const v=byId(id);
  setTimeout(()=>{const l=$('#plist');if(l){l.children[1].classList.add('done');l.children[1].classList.remove('act');l.children[2].classList.add('act');}},900);
  setTimeout(()=>{const l=$('#plist');if(l){l.children[2].classList.add('done');l.children[2].classList.remove('act');}},1800);
  setTimeout(()=>{location.hash='#/candidate/answer/'+id;},2600);
  return `
  <div class="proc"><div class="spin"></div><h3>Решение отправлено</h3>
  <p class="mut sm mt8">Платформа проверяет решение по критериям вакансии «${v.title}»</p>
  <ul id="plist">
    <li class="done">Файл решения получен</li>
    <li class="act">Анализ по критериям вакансии</li>
    <li>Уточняющий вопрос — защита от ИИ</li>
    <li>Формирование обратной связи</li>
  </ul></div>`;
}

function vAnswer(id){
  const v=byId(id);
  return `
  <div class="proc" style="max-width:640px">
    <div style="font-size:44px">🛡</div>
    <h2 class="mt8">Один вопрос по вашему решению</h2>
    <p class="mut mt8">Так мы проверяем, что решение написали вы, а не ИИ. Короткий честный ответ лучше длинного заученного.</p>
    <div class="follow mt16" style="text-align:left"><p class="sm"><b>${v.followUp}</b></p></div>
    <div class="editor-wrap mt16">
      <div class="editor-head"><span>💬 Ваш ответ</span><span class="cnt" id="anscount">0 символов</span></div>
      <textarea id="ans" class="solution-editor" style="min-height:130px" placeholder="Ваш ответ в 2–3 предложениях…" oninput="document.getElementById('anscount').textContent=App.symbols(this.value.length)"></textarea>
    </div>
    <div class="cta mt16"><button class="btn btn-p btn-lg" onclick="App.submitFollow('${id}')">Отправить ответ и увидеть оценку</button></div>
  </div>`;
}

function vResult(id){
  const v=byId(id);
  const fb=v.feedback||{avg:'4,0',scores:v.criteria.map(()=>4),strengths:['Задание выполнено полностью, структура соблюдена','Решение привязано к условию задачи, а не общими словами'],improve:['Добавить больше конкретики и обоснований решений']};
  const avgN=parseFloat(String(fb.avg).replace(',','.'));
  return `
  <div class="proc" style="max-width:720px;margin-top:32px">
    <div style="font-size:52px">✅</div>
    <h2 class="mt8">Готово! Ваша обратная связь</h2>
    <p class="mut mt8">Результат и оценка уже видны работодателю: ${v.company}</p>
    ${S.submitted[id]&&S.submitted[id].file?`<p class="sm mt8">📎 Ваше решение: <b>${esc(S.submitted[id].file.name)}</b> (${App.fmtSize(S.submitted[id].file.size)}) — передано работодателю</p>`:''}
    <div class="card pad mt24" style="text-align:left">
      <div class="between">
        <h3>Оценка по критериям</h3>
        <div class="avg ${scoreCls(avgN)}">${fb.avg} / 5</div>
      </div>
      ${critBlock(fb.scores,v.criteria)}
      <div class="divider"></div>
      <h3>💪 Сильные стороны</h3>
      <div class="mt8">${fb.strengths.map(s=>`<div class="tick">${s}</div>`).join('')}</div>
      <div class="divider"></div>
      <h3>🌱 Что улучшить</h3>
      <div class="mt8">${fb.improve.map(s=>`<div class="tick imp">${s}</div>`).join('')}</div>
      <div class="divider"></div>
      <div class="follow"><p class="sm"><b>Статус:</b> ${avgN>=4?'Сильное решение — вас рекомендуют пригласить на короткое интервью (30 минут, по сути уже знакомство).':avgN>=3?'Решение засчитано. Работодатель видит и сильные стороны, и зоны роста — решение за ним.':'Решение засчитано, но пока не проходит порог. Вы получили честную обратную связь — попробуйте другую вакансию.'}</p></div>
    </div>
    <div class="cta mt24">
      <a href="#/candidate" class="btn btn-o btn-lg">Смотреть другие вакансии</a>
    </div>
    <p class="xs mut mt16">Даже при отказе вы уходите с обратной связью по критериям — этого не даст ни одно резюме.</p>
  </div>`;
}

/* ============ РОУТЕР ============ */
const routes=[
  [/^#\/$/, ()=>vHome()],
  [/^#\/employer$/, ()=>vEmployer()],
  [/^#\/employer\/create$/, ()=>vCreate()],
  [/^#\/employer\/vacancy\/(\w+)$/, m=>vVacancyEmployer(m[1])],
  [/^#\/candidate$/, ()=>vCatalog()],
  [/^#\/candidate\/vacancy\/(\w+)$/, m=>vVacancyCandidate(m[1])],
  [/^#\/candidate\/task\/(\w+)$/, m=>vTask(m[1])],
  [/^#\/candidate\/processing\/(\w+)$/, m=>vProcessing(m[1])],
  [/^#\/candidate\/answer\/(\w+)$/, m=>vAnswer(m[1])],
  [/^#\/candidate\/result\/(\w+)$/, m=>vResult(m[1])]
];
function render(){
  const h=location.hash||'#/';
  let html='<p>Страница не найдена. <a href="#/">На главную</a></p>';
  for(const [re,fn] of routes){ const m=h.match(re); if(m){html=fn(m);break;} }
  $('#app').innerHTML=html;
  const page=h.startsWith('#/employer')?'emp':h.startsWith('#/candidate')?'cand':'home';
  $('#nav').innerHTML=`
    <a href="#/" class="${page==='home'?'on':''}">Главная</a>
    <a href="#/employer" class="${page==='emp'?'on':''}">Работодателям</a>
    <a href="#/candidate" class="${page==='cand'?'on':''}">Кандидатам</a>`;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);

/* ============ ДЕЙСТВИЯ ============ */
const App={
  symbols(n){const a=n%10,b=n%100;return n+' '+((a===1&&b!==11)?'символ':(a>=2&&a<=4&&(b<12||b>14))?'символа':'символов');},
  fmtSize(b){return b<1024?b+' Б':b<1048576?(b/1024).toFixed(b<10240?1:0)+' КБ':(b/1048576).toFixed(1)+' МБ';},
  fileIcon(t){return t==='pdf'?'📄':t==='html'?'🌐':'📝';},
  typeLabel(t){return t==='pdf'?'PDF-документ':t==='html'?'HTML-документ':'Документ Word';},
  pickFile(id,f){
    if(!f)return;
    if(!/\.(pdf|html?|docx|txt|md)$/i.test(f.name)){toast('Подойдёт файл PDF, HTML или DOCX');return;}
    S.files[id]={name:f.name,size:f.size};
    render();toast('Файл «'+f.name+'» приложен ✓',true);
  },
  rmFile(id){delete S.files[id];render();},
  dragOver(e){e.preventDefault();e.currentTarget.classList.add('dragover');},
  dragLeave(e){if(e.currentTarget.contains(e.relatedTarget))return;e.currentTarget.classList.remove('dragover');},
  dropFile(e,id){
    e.preventDefault();e.currentTarget.classList.remove('dragover');
    const f=e.dataTransfer&&e.dataTransfer.files[0];
    if(f)App.pickFile(id,f);
  },
  setTab(k,t){S.tab[k]=t;render();},
  setFilter(f){S.filter=f;render();},
  candidate(id,idx){candModal(id,idx);},
  closeModal,
  decide(vacId, idx, what){
    const v=byId(vacId), c=v.candidates[idx];
    if(what==='invite'){c.status='rec';toast(c.name+' приглашён(а) на собеседование ✓',true);}
    else{c.status='wait';toast(c.name+': отказ отправлен с обратной связью');}
    render();
  },
  wizNext(n){wiz.step=n;render();},
  wizAdapt(){wiz.processing=true;wiz.step=3;render();setTimeout(()=>{wiz.processing=false;render();},2100);},
  wizPublish(){
    const id='v'+Date.now();
    S.created.unshift({id,fresh:true,icon:'✨',sphere:wiz.sphere,
      sc:wiz.sphere==='Юриспруденция'?'s-law':wiz.sphere==='Маркетинг'?'s-mkt':'s-it',
      title:wiz.title||'Новая вакансия',company:'Ваша компания',city:'Санкт-Петербург',
      level:'Можно без опыта',salary:'',work:'',short:wiz.desc,
      taskTime:'2,5 часа',taskIntro:'Задание адаптировано из вашего кейса: конфиденциальное удалено, сложность — уровень новичка.',
      taskSteps:['Найдите 3–4 рискованных пункта договора','Укажите применимую норму ГК РФ','Предложите готовую правку формулировки','Напишите заключение на 5–7 предложений'],
      materials:['Договор подряда № 147 (адаптирован из вашего)','Шаблон заключения'],
      criteria:[{n:'Выявление ключевых рисков',w:30},{n:'Знание норм (ГК РФ)',w:25},{n:'Качество правок',w:25},{n:'Ясность заключения',w:20}],
      followUp:'В 2–3 предложениях объясните: какую норму вы считаете ключевой для защиты заказчика и почему именно она?',
      candidates:[]});
    wiz.step=4;wiz.newId=id;render();toast('Вакансия опубликована ✓',true);
  },
  submit(id){
    if(!S.files[id]){toast('Приложите решение файлом: PDF, HTML или DOCX');return;}
    S.drafts[id]=$('#sol')?$('#sol').value.trim():'';
    location.hash='#/candidate/processing/'+id;
  },
  submitFollow(id){
    const a=$('#ans')?$('#ans').value.trim():'';
    if(a.length<10){toast('Ответьте коротко на вопрос — это важно');return;}
    S.submitted[id]={answer:S.drafts[id]||'',follow:a,file:S.files[id]||null};
    location.hash='#/candidate/result/'+id;toast('Решение и ответ отправлены работодателю ✓',true);
  }
};
render();
</script>
</body>
</html>
